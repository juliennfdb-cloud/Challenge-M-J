<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e9f5fb"><title>Objectif Santé 45 Jours Challenge — Test</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#dff2fa,#f6f8ff 48%,#fff0e8);color:#24364e;font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}.app{max-width:560px;margin:auto;padding:22px 16px 105px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.logo{font-weight:900;font-size:23px;letter-spacing:-.7px}.sub,.muted{color:#798ba0;font-size:12px}.pill{font-size:12px;color:#177eaa;background:white;padding:9px 12px;border-radius:30px;font-weight:800}.card{background:#fff;border:1px solid #e6edf4;border-radius:22px;padding:19px;margin:13px 0;box-shadow:0 6px 25px #3152720b}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.tile{padding:14px;background:#f5f9fc;border-radius:16px}.big{font-size:26px;font-weight:900;letter-spacing:-.6px}.label{font-size:13px;font-weight:750}h2{font-size:21px;margin:0 0 5px}h3{font-size:16px;margin:0 0 11px}p{line-height:1.5}.track{height:9px;background:#e8eef4;border-radius:30px;overflow:hidden;margin:10px 0}.fill{height:100%;background:#23a7d2;border-radius:30px}.btn{border:0;border-radius:13px;padding:12px 15px;font-weight:800;background:#20a8d3;color:white;cursor:pointer}.btn.ghost{background:#e9f5fa;color:#147fa4}.btn.dark{background:#253d56}.btn.small{padding:8px 11px;font-size:12px}input,select{width:100%;padding:11px 12px;border:1px solid #dbe5ef;border-radius:12px;font:inherit;background:white;color:#24364e;margin:6px 0 10px}input[type=checkbox]{width:19px;height:19px;accent-color:#25b58b;margin:0}label{font-size:13px;font-weight:700;display:block}.check{display:flex;align-items:center;gap:11px;padding:12px;background:#f5f9fc;border-radius:14px;margin:9px 0}.check label{flex:1}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fffefaee;backdrop-filter:blur(12px);border-top:1px solid #e3ebf2;display:flex;justify-content:center;z-index:5}.tabs-inner{display:grid;grid-template-columns:repeat(4,1fr);max-width:560px;width:100%}.tabs button{border:0;background:none;padding:13px 3px 16px;color:#8b9aab;font-weight:750;font-size:11px;cursor:pointer}.tabs button.active{color:#149ac4}.tabs b{display:block;font-size:21px;margin-bottom:3px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{aspect-ratio:1;border:0;border-radius:12px;background:#edf1f6;color:#61738a;font-weight:800;cursor:pointer}.day.good{background:#b8ecd8;color:#12694b}.day.bad{background:#ffe2e2;color:#9e4c55}.day.future{background:#f5f7fa;color:#b3bfcb}.day.selected{outline:3px solid #249dc5;outline-offset:1px}.week{border:1px solid #e8edf3;padding:11px;border-radius:14px;margin:9px 0}.medal{display:inline-block;border-radius:20px;padding:5px 10px;font-size:12px;font-weight:850}.gold{background:#fff0b9;color:#9b6b00}.silver{background:#e8edf3;color:#617083}.bronze{background:#f4ded0;color:#98603c}.none{background:#f2f4f7;color:#96a1ae}.bars{display:flex;align-items:end;justify-content:space-between;height:130px;gap:7px;border-bottom:1px solid #dce6ef;padding:8px 2px 0}.barwrap{display:flex;align-items:center;flex-direction:column;justify-content:end;flex:1;height:100%;font-size:10px;color:#7c8da0;gap:5px}.bar{width:100%;max-width:30px;background:#55bce0;border-radius:7px 7px 0 0;min-height:3px}.hide{display:none!important}.notice{background:#eaf7fb;color:#276e87;padding:12px;border-radius:13px;font-size:13px}.divider{height:1px;background:#e9edf2;margin:15px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.tiny{font-size:11px;color:#8998a9}.modal{position:fixed;inset:0;background:#24364e88;z-index:20;display:flex;align-items:center;justify-content:center;padding:15px}.modalbox{background:white;border-radius:23px;max-width:480px;width:100%;max-height:92vh;overflow:auto;padding:23px}a{color:#138fb9} .footer-note{text-align:center;font-size:11px;color:#8d9aaa;margin-top:16px}
</style></head><body><div class="app"><header><div><div class="sub">LE CHALLENGE DE MAXIME & JULIEN</div><div class="logo">Objectif <span style="color:#1ba8d0">Santé 45 Jours</span></div></div><div class="pill" id="headerDay">VERSION TEST</div></header><div id="screen"></div><div class="footer-note">Mode test : jours futurs activés · Tes données restent sur ce navigateur</div></div><nav class="tabs"><div class="tabs-inner"><button data-tab="home" class="active"><b>⌂</b>Accueil</button><button data-tab="missions"><b>✓</b>Missions</button><button data-tab="calendar"><b>▦</b>Calendrier</button><button data-tab="progress"><b>▥</b>Mes progrès</button></div></nav><div id="modal" class="modal hide"><div class="modalbox" id="modalContent"></div></div><script>
const KEY='mj45-v3-test';const DAYS=45;const TEST_MODE=true;let tab='home';let state;const iso=d=>{const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};const parse=s=>new Date(s+'T12:00:00');const add=(s,n)=>{let d=parse(s);d.setDate(d.getDate()+n);return iso(d)};const diff=(a,b)=>Math.round((parse(a)-parse(b))/86400000);const today=()=>iso(new Date());const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))}catch{return null}};state=load()||{setup:false,start:today(),joined:today(),stepsGoal:6000,food:'Ajouter des légumes à mes repas',strengthGoal:2,cardioGoal:2,records:{}};let selected=today();function save(){localStorage.setItem(KEY,JSON.stringify(state))}function rec(date){return state.records[date]||{steps:null,food:false,strength:0,cardio:0}}function within(d){return diff(d,state.start)>=0&&diff(d,state.start)<DAYS}function eligible(d){return within(d)&&diff(d,state.joined)>=0}function done(d){let r=rec(d);return r.steps!==null&&Number(r.steps)>=state.stepsGoal&&r.food}function weekRange(i){let dates=Array.from({length:7},(_,j)=>add(state.start,i*7+j)).filter(within);return dates}function wk(i){let dates=weekRange(i),active=dates.filter(d=>eligible(d)&&(TEST_MODE||diff(today(),d)>=0)),all=active.length>0&&active.every(done),s=dates.reduce((a,d)=>a+Number(rec(d).strength||0),0),c=dates.reduce((a,d)=>a+Number(rec(d).cardio||0),0),four=s>=state.strengthGoal&&c>=state.cardioGoal;let complete=TEST_MODE||dates.every(d=>diff(today(),d)>=0);let filled=active.length>0&&active.every(d=>rec(d).steps!==null);let medal=!(TEST_MODE?filled:complete)||!active.length?'':all&&four?'or':(all||four)?'argent':'bronze';return {dates,active,all,s,c,medal,complete,days:active.filter(done).length}}function badge(m){return `<span class="medal ${m==='or'?'gold':m==='argent'?'silver':m==='bronze'?'bronze':'none'}">${m==='or'?'🥇 OR':m==='argent'?'🥈 ARGENT':m==='bronze'?'🥉 BRONZE':'En cours'}</span>`}function bar(v,max,color){return `<div class="track"><div class="fill" style="width:${Math.min(100,100*v/Math.max(1,max))}%;background:${color||'#23a7d2'}"></div></div>`}function summary(){let current=Math.max(0,Math.min(6,Math.floor(diff(today(),state.start)/7)));return wk(current)}function updateHeader(){let day=diff(today(),state.start)+1;document.getElementById('headerDay').textContent=day>=1&&day<=DAYS?'JOUR '+day+' / '+DAYS:day>DAYS?'CHALLENGE TERMINÉ':'AVANT DÉPART';document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}function home(){let r=rec(today()),w=summary();return `<h2>Bonjour ${esc(state.name||'')}</h2><p class="muted">Chaque pas compte. Avance à ton rythme !</p><div class="card"><div class="row"><div><div class="muted">Mon objectif du jour</div><div class="big">${r.steps===null?'—':Number(r.steps).toLocaleString('fr-FR')} <span style="font-size:13px;color:#8b9baa">/ ${state.stepsGoal.toLocaleString('fr-FR')} pas</span></div></div><span style="font-size:30px">👟</span></div>${bar(Number(r.steps||0),state.stepsGoal)}<div class="row"><span class="label">Habitude alimentaire</span><span>${r.food?'✅ Validée':'○ À valider'}</span></div><p class="muted">${esc(state.food)}</p><button class="btn" onclick="go('missions')">Renseigner ma journée</button></div><div class="card"><h3>Mes séances de la semaine</h3><div class="grid"><div class="tile"><div class="muted">💪 Renforcement</div><div class="big">${w.s}/${state.strengthGoal}</div>${bar(w.s,state.strengthGoal,'#a98cdd')}</div><div class="tile"><div class="muted">🚴 Cardio</div><div class="big">${w.c}/${state.cardioGoal}</div>${bar(w.c,state.cardioGoal,'#27b88d')}</div></div><p class="muted">Tu choisis tes jours de séance et leur intensité. Les séances supplémentaires comptent aussi.</p></div><div class="card"><h3>Ma semaine</h3><div class="row"><div><div class="big">${w.days}/${w.dates.filter(d=>eligible(d)).length||0}</div><div class="muted">Journées validées jusqu'à aujourd'hui</div></div>${badge(w.medal)}</div>${bar(w.days,w.dates.filter(d=>eligible(d)).length||1)}<button class="btn ghost" onclick="go('calendar')">Voir mon calendrier</button></div><div class="notice">MODE TEST : les journées futures peuvent devenir vertes. Une médaille apparaît lorsque tous les jours de la semaine ont un nombre de pas renseigné.</div>`}function missions(){let r=rec(selected);return `<h2>Mes missions</h2><p class="muted">Choisis une journée pour enregistrer tes actions. Tes objectifs restent modifiables.</p><div class="card"><div class="row"><h3 style="margin:0">Journée à renseigner</h3><input style="width:175px;margin:0" type="date" min="${state.start}" max="${add(state.start,DAYS-1)}" value="${selected}" onchange="selectDate(this.value)"></div>${!eligible(selected)?'<p class="notice">Cette journée précède ton arrivée ou est hors du challenge : elle reste neutre.</p>':`<div class="divider"></div><label>👟 Nombre de pas réalisés</label><input type="number" min="0" step="1" value="${r.steps??''}" placeholder="Ex. 6500" onchange="setRecord('steps',this.value===''?null:Math.max(0,Number(this.value)))"><div class="muted">Objectif : ${state.stepsGoal.toLocaleString('fr-FR')} pas</div><div class="check"><input id="foodcheck" type="checkbox" ${r.food?'checked':''} onchange="setRecord('food',this.checked)"><label for="foodcheck">🥗 ${esc(state.food)}</label><button class="btn ghost small" onclick="editFood()" title="Modifier mon habitude">✎ Modifier</button></div><div class="divider"></div><h3>Mes séances réalisées</h3><p class="muted">Ajoute une séance le jour où tu la fais. Tu peux en enregistrer plusieurs le même jour.</p><div class="row"><span>💪 Renforcement : <b>${r.strength||0}</b></span><div class="actions"><button class="btn ghost small" onclick="bump('strength',-1)">−</button><button class="btn small" onclick="bump('strength',1)">+</button></div></div><div class="divider"></div><div class="row"><span>🚴 Cardio : <b>${r.cardio||0}</b></span><div class="actions"><button class="btn ghost small" onclick="bump('cardio',-1)">−</button><button class="btn small" onclick="bump('cardio',1)">+</button></div></div><div class="divider"></div><div class="notice">${done(selected)?'✓ Journée validée : pas et nutrition atteints !':'Journée pas encore validée : vérifie tes pas et ton habitude alimentaire.'}</div>`}</div><div class="card"><h3>Mes objectifs</h3><label>Objectif quotidien de pas</label><input type="number" id="goalsteps" min="1" value="${state.stepsGoal}"><div class="grid"><div class="tile"><div class="muted">Renforcement / semaine</div><div class="big">2</div></div><div class="tile"><div class="muted">Cardio / semaine</div><div class="big">2</div></div></div><p class="tiny">Les objectifs sportifs sont fixes. Tu peux réaliser des séances supplémentaires.</p><button class="btn" onclick="updateGoals()">Enregistrer mes objectifs</button><p class="tiny">Modifier ton objectif de pas recalcule les bilans passés.</p></div><div class="card"><h3>📚 Exercices et ressources</h3><p class="muted">Emplacement prévu pour les PDF : renforcement sans matériel, avec matériel, idées de cardio et conseils alimentaires.</p><div class="notice">Les PDF définitifs seront ajoutés après validation de leur contenu avec Maxime.</div></div>`}function calendar(){let weeks=Math.ceil(DAYS/7),out=`<h2>Mon calendrier</h2><p class="muted">Vert = pas + nutrition validés. Les médailles récompensent chaque semaine terminée.</p><div class="card"><div class="row"><span class="label">🟩 Validé &nbsp; 🟥 Non validé</span><span class="tiny">Gris = neutre / non renseigné</span></div>`;for(let i=0;i<weeks;i++){let w=wk(i);out+=`<div class="week"><div class="row"><b>Semaine ${i+1}</b>${badge(w.medal)}</div><div class="calendar" style="margin-top:11px">${w.dates.map(d=>{let future=diff(d,today())>0,ok=eligible(d),cls=!ok?'future':done(d)?'good':(rec(d).steps!==null||rec(d).food)?'bad':'future';return `<button class="day ${cls} ${selected===d?'selected':''}" title="${d}" onclick="pick('${d}')">${parse(d).getDate()}</button>`}).join('')}</div><div class="row" style="margin-top:10px"><span class="tiny">${w.days}/${w.dates.filter(d=>eligible(d)).length} jours validés</span><span class="tiny">💪 ${w.s}/${state.strengthGoal} · 🚴 ${w.c}/${state.cardioGoal}</span></div></div>`}return out+`</div><div class="notice">Mode test : les jours futurs peuvent être validés en vert. Les jours avant ton inscription restent neutres. Les médailles sont calculées dès que les conditions sont remplies pour la semaine.</div>`}function progress(){let weeks=Array.from({length:Math.ceil(DAYS/7)},(_,i)=>wk(i)),eligibleDays=Array.from({length:DAYS},(_,i)=>add(state.start,i)).filter(d=>eligible(d)&&(TEST_MODE||diff(today(),d)>=0)),valid=eligibleDays.filter(done).length,s=weeks.reduce((a,w)=>a+w.s,0),c=weeks.reduce((a,w)=>a+w.c,0);return `<h2>Mes progrès</h2><p class="muted">Tes statistiques se mettent à jour automatiquement.</p><div class="grid"><div class="card" style="margin:0"><div class="muted">Régularité (jours renseignés)</div><div class="big">${eligibleDays.filter(d=>rec(d).steps!==null||rec(d).food).length?Math.round(valid/eligibleDays.filter(d=>rec(d).steps!==null||rec(d).food).length*100):0}%</div></div><div class="card" style="margin:0"><div class="muted">Renforcement total</div><div class="big">${s}</div></div><div class="card" style="margin:0"><div class="muted">Cardio total</div><div class="big">${c}</div></div></div><div class="card"><h3>Jours validés par semaine</h3><div class="bars">${weeks.map((w,i)=>`<div class="barwrap"><span>${w.days}</span><div class="bar" style="height:${Math.max(3,w.days/7*100)}%"></div><span>S${i+1}</span></div>`).join('')}</div><p class="tiny">Graphique : nombre de jours verts par semaine</p></div><div class="card"><h3>Mes médailles</h3><div class="grid">${weeks.map((w,i)=>`<div class="tile"><div class="muted">Semaine ${i+1}</div><div style="margin-top:9px">${badge(w.medal)}</div></div>`).join('')}</div></div><div class="card"><h3>Sauvegarde</h3><p class="muted">Les données sont conservées sur ce navigateur. Exporte une sauvegarde pour éviter de les perdre en changeant d'appareil ou en effaçant les données du navigateur.</p><div class="actions"><button class="btn ghost" onclick="exportData()">Exporter mes données</button><button class="btn ghost" onclick="document.getElementById('importfile').click()">Importer</button><input class="hide" id="importfile" type="file" accept="application/json" onchange="importData(event)"></div></div>`}function render(){updateHeader();document.getElementById('screen').innerHTML=tab==='home'?home():tab==='missions'?missions():tab==='calendar'?calendar():progress();if(!state.setup)setupModal()}function go(t){tab=t;render();window.scrollTo(0,0)}document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.tab)));function selectDate(d){selected=d;render()}function pick(d){selected=d;go('missions')}function setRecord(k,v){if(!eligible(selected))return;state.records[selected]={...rec(selected),[k]:v};save();render()}function bump(k,delta){let r=rec(selected);setRecord(k,Math.max(0,Number(r[k]||0)+delta))}function editFood(){let value=prompt('Modifier mon habitude alimentaire',state.food);if(value===null)return;value=value.trim();if(!value){alert('Indique une habitude alimentaire.');return}state.food=value.slice(0,140);save();render()}function updateGoals(){let st=Number(document.getElementById('goalsteps').value);if(!Number.isFinite(st)||st<1){alert('Vérifie ton objectif de pas.');return}Object.assign(state,{stepsGoal:Math.round(st),strengthGoal:2,cardioGoal:2});save();render()}function setupModal(){let m=document.getElementById('modal');m.classList.remove('hide');document.getElementById('modalContent').innerHTML=`<h2>Bienvenue dans Objectif Santé !</h2><p class="muted">Quelques questions pour préparer automatiquement tes objectifs.</p><label>Ton prénom (facultatif)</label><input id="qname" placeholder="Prénom" value="${esc(state.name||'')}"><label>Connais-tu ta moyenne quotidienne de pas ?</label><select id="qknown" onchange="document.getElementById('qavgwrap').classList.toggle('hide',this.value==='no')"><option value="yes">Oui</option><option value="no">Non</option></select><div id="qavgwrap"><label>Ma moyenne actuelle</label><input id="qavg" type="number" min="0" value="4000"></div><label>Habitude alimentaire à travailler</label><select id="qfood" onchange="document.getElementById('qcustom').classList.toggle('hide',this.value!=='custom')"><option value="Ajouter des légumes à mes repas">Ajouter des légumes à mes repas</option><option value="Boire de l'eau à la place des boissons sucrées">Remplacer les boissons sucrées par de l'eau</option><option value="Limiter le grignotage">Limiter le grignotage</option><option value="custom">Personnaliser…</option></select><input class="hide" id="qcustom" placeholder="Mon habitude personnelle" maxlength="140"><label>Date de départ collectif (modifiable pour le test)</label><input id="qstart" type="date" value="${today()}"><label>Date à laquelle je rejoins le challenge</label><input id="qjoined" type="date" value="${today()}"><div class="notice">Objectifs sportifs préremplis : 2 séances de renforcement + 2 cardio par semaine.</div><p class="notice">MODE TEST : tu peux remplir les jours futurs, les voir en vert et obtenir les médailles immédiatement lorsque toute la semaine est renseignée.</p><button class="btn" style="width:100%;margin-top:14px" onclick="finishSetup()">Commencer mon challenge</button>`}function finishSetup(){let known=document.getElementById('qknown').value,avg=Number(document.getElementById('qavg').value),start=document.getElementById('qstart').value,joined=document.getElementById('qjoined').value,foodSel=document.getElementById('qfood').value,food=foodSel==='custom'?document.getElementById('qcustom').value.trim():foodSel;if(!start||!joined||diff(joined,start)<0||diff(joined,start)>=DAYS||!food||(known==='yes'&&(!Number.isFinite(avg)||avg<0))){alert('Vérifie les dates, la moyenne de pas et ton habitude alimentaire.');return}Object.assign(state,{setup:true,name:document.getElementById('qname').value.trim(),start,joined,stepsGoal:known==='yes'?Math.round(avg)+2000:6000,food,strengthGoal:2,cardioGoal:2});selected=diff(today(),start)<0?start:diff(today(),start)>=DAYS?add(start,DAYS-1):today();save();document.getElementById('modal').classList.add('hide');render()}function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mj45-sauvegarde.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importData(e){let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let d=JSON.parse(reader.result);if(!d.setup||!d.start||!d.joined||!d.records||typeof d.records!=='object')throw Error();if(confirm('Remplacer les données actuelles par cette sauvegarde ?')){state=d;state.strengthGoal=2;state.cardioGoal=2;save();render()}}catch{alert('Fichier de sauvegarde invalide.')}};reader.readAsText(file)}render();
</script></body></html>
